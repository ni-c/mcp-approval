version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Keep lockstep packages together so major bumps don't arrive as
      # individually broken PRs.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # The catch-all has to repeat the patterns above as exclude-patterns.
      # Dependabot documents the first matching group as the winner and does not
      # behave that way (dependabot-core#9765, #14143): on 2026-08-27 it put
      # `vitest` in the vitest group and `@vitest/coverage-v8` in this one, and
      # the resulting half-update leaves a lockfile whose `npm ci` dies with
      # "Cannot read properties of null (reading 'edgesOut')".
      minor-and-patch:
        exclude-patterns:
          - vitest
          - '@vitest/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze are separate dependencies to Dependabot but must always
      # move together — a version mismatch kills the codeql job.
      codeql:
        patterns:
          - github/codeql-action*
