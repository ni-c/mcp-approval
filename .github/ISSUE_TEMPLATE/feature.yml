name: Feature request
description: Something this library should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        The situation, not the solution. What does your server need to express
        that it cannot express today?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead right now?
      description: >-
        Useful even when the answer is "nothing". If you are working around it,
        the shape of the workaround usually says what the API is missing.
  - type: textarea
    id: idea
    attributes:
      label: A shape you had in mind
      description: Optional. Pseudo-code is fine.
      render: ts
